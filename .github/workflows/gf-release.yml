name: GF release

# Builds jag and the Jaguar assets for the girtsf fork and publishes them as a
# release tagged with the built jag version (<main.go version>-gf.<run number>).
# An empty sdk-version uses the latest release of JAG_TOIT_GITHUB_REPO (from
# fork.mk). Run on the gf branch:
#
#   gh workflow run gf-release.yml -R girtsf/jaguar --ref gf [-f sdk-version=v2.0.0-alpha.199-gf.1]
#
# The upstream "Build" workflow also runs on releases; disable it in the fork.

on:
  workflow_dispatch:
    inputs:
      sdk-version:
        description: Toit SDK version, e.g. v2.0.0-alpha.199-gf.1 (default latest SDK release)
        type: string
        default: ""

env:
  JAG_BUILD_RELEASE: 1
  JAG_GF_BUILD: ${{ github.run_number }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"

      - name: Pick SDK version
        env:
          INPUT_SDK_VERSION: ${{ inputs.sdk-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK_VERSION=$INPUT_SDK_VERSION
          if [[ -z "$SDK_VERSION" ]]; then
            TOIT_REPO=$(sed -n 's/^JAG_TOIT_GITHUB_REPO ?= //p' fork.mk)
            SDK_VERSION=$(gh release view -R "$TOIT_REPO" --json tagName -q .tagName)
          fi
          echo "JAG_SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV

      - name: Build jag
        run: |
          make JAG_BINARY=linux/jag_gf jag
          GOOS=linux GOARCH=arm make JAG_BINARY=linux-arm/jag_gf jag
          GOOS=linux GOARCH=arm64 make JAG_BINARY=linux-arm64/jag_gf jag
          build/linux/jag_gf --no-analytics version | tee build/version.txt
          echo "TAG=$(awk -F'\t ' 'NR==1 {print $2}' build/version.txt)" >> $GITHUB_ENV
          echo "SDK=$(awk -F'\t ' 'NR==2 {print $2}' build/version.txt)" >> $GITHUB_ENV

      - name: Build assets
        run: |
          make download-sdk
          make assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir build/release
          tar -czf build/release/jag_gf_linux.tgz -C build/linux jag_gf
          tar -czf build/release/jag_gf_linux_arm.tgz -C build/linux-arm jag_gf
          tar -czf build/release/jag_gf_linux_arm64.tgz -C build/linux-arm64 jag_gf
          tar -czf build/release/assets.tar.gz -C build -h assets
          gh release create "$TAG" build/release/* \
              --target "$GITHUB_SHA" --title "$TAG" --notes "Toit SDK $SDK, commit $GITHUB_SHA"
